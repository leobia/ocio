[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ocio"
version = "0.1.0"
description = "Backend per OCIO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "cohere>=5.20,<6",
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "openai>=1.109,<2",
  "openai-agents>=0.3.3,<0.4",
  "pdfplumber>=0.11,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "tiktoken>=0.11,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
ocio = "ocio.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running local PostgreSQL database",
]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
