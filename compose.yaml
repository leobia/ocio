services:
  db:
    build:
      context: infra/postgres
      dockerfile: Dockerfile
    command: postgres -c shared_preload_libraries=pg_textsearch
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocio}
      POSTGRES_USER: ${POSTGRES_USER:-ocio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocio_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ocio-postgres-data:/var/lib/postgresql/data

volumes:
  ocio-postgres-data:
