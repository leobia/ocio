# Registro OCIO delle fonti e delle acquisizioni locali.
# Le fonti remote si acquisiscono manualmente; l'importazione usa solo i file locali.
version: 2

ingestion_policy:
  discovery_new_acts: false
  prefer_formats: [AKN, JSON, XML, HTML, PDF]
  index_current_law_first: true
  keep_historical_versions: true
  reembed_only_if_content_hash_changes: true
  do_not_duplicate_same_text_across_sources: true

authority_classes:
  law: "Normativa"
  official_interpretation: "Interpelli/circolari/chiarimenti istituzionali"
  technical_guidance: "Conoscenza tecnica non normativa"

providers:
  normattiva:
    authority_class: law
    role: "Source of truth tecnica principale per normativa italiana vigente/multivigente"
    portal: "https://dati.normattiva.it/"
    api_docs: "https://dati.normattiva.it/assets/come_fare_per/Normattiva%20OpenData.html"
    download_docs: "https://dati.normattiva.it/Come-scaricare-i-dati"

  gazzetta:
    authority_class: law
    role: "Fonte autentica/originale per verifica e fallback"
    portal: "https://www.gazzettaufficiale.it/"

  mlps:
    authority_class: official_interpretation
    role: "Interpelli e chiarimenti ufficiali"
    interpelli: "https://www.lavoro.gov.it/documenti-e-norme/interpelli/Pagine/default"
    interpelli_info: "https://www.lavoro.gov.it/temi-e-priorita/salute-e-sicurezza/focus-on/interpello/pagine/default"
    accordo_2025: "https://www.lavoro.gov.it/temi-e-priorita/salute-e-sicurezza/focus/pagine/accordo-stato-regioni-del-17042025-materia-di-formazione"
    accordo_2025_pdf: "https://lavoro.gov.it/temi-e-priorita-salute-e-sicurezza/focus/accordo-stato-regioni-17042025-allegato"
    faq_accordo_2025: "https://www.lavoro.gov.it/temi-e-priorita-salute-e-sicurezza/focus/faq-accordo-stato-regioni-27032026"

  inl:
    authority_class: official_interpretation
    role: "Circolari/note di vigilanza e snapshot coordinato del Testo Unico"
    safety_page: "https://www.ispettorato.gov.it/documenti-e-normativa/normativa-di-interesse/salute-e-sicurezza-nei-luoghi-di-lavoro/"
    circulars: "https://www.ispettorato.gov.it/documenti-e-normativa/orientamenti-giuridici-inl/circolari/"
    notes: "https://www.ispettorato.gov.it/documenti-e-normativa/orientamenti-giuridici-inl/note-e-pareri/"
    tu_snapshot_2026_pdf: "https://www.ispettorato.gov.it/files/2026/01/TU-81-08-Ed.-Gennaio-2026.pdf"

  vvf:
    authority_class: official_interpretation
    role: "Normativa/chiarimenti antincendio"
    collection: "https://www.vigilfuoco.it/servizi-le-aziende-e-i-professionisti/prevenzione-incendi/norme-di-prevenzione-incendi"
    coordinated_dm_1_2_3_2021_pdf: "https://www.vigilfuoco.it/sites/default/files/2024-09/COORD_DDMM_01-02-03_09_2021_0.pdf"

  stato_regioni:
    authority_class: law
    role: "Fonte dell'Accordo 59/CSR/2025"
    accordo_59_2025: "https://www.statoregioni.it/it/conferenza-stato-regioni/sedute-2025/seduta-del-17-aprile-2025/atti-17-aprile-2025/repertorio-atto-n-59csr/"

